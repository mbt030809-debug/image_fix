plugins {
    id 'com.android.application'
}

android {
    namespace 'app.imagefix.editor'
    compileSdk 34

    defaultConfig {
        applicationId 'app.imagefix.editor'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.9.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug // 개인용 사이드로드. 배포 시 별도 키로 교체
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError false
    }
}
